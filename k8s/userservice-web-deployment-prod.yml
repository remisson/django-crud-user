apiVersion: apps/v1
kind: Deployment
metadata:
  name: userservice-web
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
      - name: staticfiles
        emptyDir: {}
      containers:
      - name: web
        image: userservice-web:latest
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
          - |
            python /app/manage.py makemigrations &&
            python /app/manage.py migrate &&
            python /app/manage.py collectstatic --noinput &&
            gunicorn --workers 3 --timeout 120 --bind 0.0.0.0:8000 userservice.wsgi:application
        ports:
        - containerPort: 8000
        env:
        - name: DB_HOST
          value: mysql-service
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_DATABASE
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_PASSWORD
        - name: DB_PORT
          value: "3306"
        volumeMounts:
        - name: staticfiles
          mountPath: /app/staticfiles

      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
        - name: staticfiles
          mountPath: /app/staticfiles
