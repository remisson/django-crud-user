{% spaceless %}
{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="Django User Login Template">
    <meta name="author" content="Remisson dos Santos Silva">
    <title>Django Modification User Template</title>
    <link href="{% static 'bootstrap-4.0.0/dist/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'bootstrap-4.0.0/docs/4.0/examples/sign-in/signin.css' %}" rel="stylesheet">
  </head>
  <body class="text-center">
    <div>
      <form class="form-signin" method="POST" action="{% url 'edit_account' pk=user.id %}">
        {% csrf_token %}
        <h1 class="h3 mb-3 font-weight-normal">Account modification form</h1>

        <label for="id_email" class="sr-only">Email address</label>
        <input type="email" maxlength="320" name="email" id="id_email" class="form-control" value="{% if user.email %}{{user.email}}{% endif %}" placeholder="Email address" required autofocus autocomplete="off">

        <label for="id_username" class="sr-only">Username</label>
        <input type="textfield" maxlength="50" name="username" id="id_username" class="form-control" value="{% if user.username %}{{user.username}}{% endif %}" placeholder="Username" required autocomplete="off">

        <p>
          <a href="{% url 'login' %}">Sign in</a>
        </p>

        <button class="btn btn-lg btn-primary btn-block" type="submit">Save</button>
      </form>
    </div>
    <div>
    {% for mss in form.non_field_errors %}
      <div class="alert alert-danger" role="alert">
        {{mss}}
      </div>
    {% endfor %}
    </div>

  </body>
</html>
{% endspaceless %}
