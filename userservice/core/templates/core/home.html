{% spaceless %}
{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="Django User Login Template">
    <meta name="author" content="Remisson dos Santos Silva">
    <title>Django User Home Template</title>
    <link href="{% static 'bootstrap-4.0.0/dist/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'bootstrap-4.0.0/docs/4.0/examples/sign-in/signin.css' %}" rel="stylesheet">
  </head>
  <body class="text-center">
    <div>
      <table class="table">
        <thead>
          <tr>
            <th scope="col">Username</th>
            <th scope="col">email</th>
            <th scope="col"></th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>{{user.username}}</td>
            <td>{{user.email}}</td>
            <td>
              <a class="btn btn-sm btn-primary btn-block" href="{% url 'logout' %}">Logout</a>              
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div>
  </body>
</html>
{% endspaceless %}
