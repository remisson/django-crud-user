{% spaceless %}
{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="Django User Login Template">
    <meta name="author" content="Remisson dos Santos Silva">
    <title>Django User Login Template</title>
    <link href="{% static 'bootstrap-4.0.0/dist/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'bootstrap-4.0.0/docs/4.0/examples/sign-in/signin.css' %}" rel="stylesheet">
  </head>
  <body class="text-center">
    <div>
      <form class="form-signin" method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        <h1 class="h3 mb-3 font-weight-normal">Please sign in</h1>
        <label for="id_email" class="sr-only">Email address</label>
        <input type="email" maxlength="320" name="email" id="id_email" class="form-control" placeholder="Email address" required autofocus>
        <label for="id_password" class="sr-only">Password</label>
        <input type="password" id="id_password" name="password" class="form-control" placeholder="Password" required>
        <p>
          <a href="{% url 'create_account' %}">Create account</a>
        </p>
        <button class="btn btn-lg btn-primary btn-block" type="submit">Sign in</button>
      </form>
    </div>
    <div>

    {% if messages %}
      {% for message in messages %}
      <div class="alert alert-danger" role="alert">
        {{ message }}
      </div>
      {% endfor %}
    {% endif %}

    {% for mss in form.non_field_errors %}
      <div class="alert alert-danger" role="alert">
        {{mss}}
      </div>
    {% endfor %}
    </div>

  </body>
</html>
{% endspaceless %}
